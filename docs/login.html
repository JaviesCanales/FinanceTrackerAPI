<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link
    href="login.css"
    rel="stylesheet"
    />
    <script src="login.js" defer></script>
</head>
<body>
    <header>
        <h1> FinanceTracker </h1>
    </header>
    <section id="login">
        <h2> Log in </h2>
        <form id="login-form">

            <input
            type="text"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
            >

            <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            >

            <button type="submit">Log in</button>

        </form>
        </section>

        <section id="register">
            <h2> Register </h2>
            <form id="register-form">

                <input 
                type="text"
                id="name"
                name="name"
                placeholder="Full name"
                required
                >

                <input
                type="text"
                id="register-email"
                name="email"
                placeholder="Enter your email"
                required
                >

                <input
                type="password"
                id="register-password"
                name="password"
                placeholder="Enter your password"
                required
                >

                <input  
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm your password"
                >

                <button type="submit">Register</button>

            </form>
        </section>

</body>
</html>
